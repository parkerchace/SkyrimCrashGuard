# ═══════════════════════════════════════════════════════════════════════
# Skyrim Crash Guard Configuration
# Engine-Level Crash Recovery System
# ═══════════════════════════════════════════════════════════════════════

[General]
enabled = true
logLevel = 1  # 0=off, 1=errors/warnings only, 2=info, 3=debug, 4=trace

[VEH]
# Vectored Exception Handler — the core recovery engine.
# It intercepts CPU exceptions (null pointer crashes, bad reads/writes, etc.)
# before the game can crash and attempts to recover automatically.
enabled = true
cascadeLimit = 3  # How many recovery attempts to allow for a single crash event.
                  # Higher = more thorough recovery but slower. Default 3 is safe for most systems.

# High-frequency crash throttling:
# If a mod crashes repeatedly (e.g., dozens of times per second), CrashGuard
# switches to "silent mode" so it stops flooding the log file with identical entries.
# It still recovers the crashes — it just stops logging them until things calm down.
enableModuleThrottling = true   # Enable per-module crash frequency throttling
moduleThrottleThreshold = 20    # Crashes before entering silent mode
moduleThrottleWindowMs = 2000   # Tracking window in milliseconds (2 seconds)
moduleSilentDurationMs = 30000  # Duration of silent recovery mode (30 seconds)
moduleRelogIntervalMs = 60000   # Re-log interval while in silent mode (60 seconds)

[Patches]
# Proactive engine patches — CrashGuard registers known crash sites with VEH.
# No game memory is modified; these are read-only address registrations used
# to give VEH better recovery context when a crash happens at a known location.
enabled = true

[ProactiveValidation]
# These flags enable validation checks that run BEFORE the engine processes data.
# Turn individual ones off if they cause performance issues or conflicts.
enableMeshValidation = true      # Check 3D mesh data for corruption (NaN positions, bad normals)
enableAnimationValidation = true # Check animation graph transitions for invalid state
enableScriptMonitoring = true    # Enable script timeout tracking and blacklist
enableCellValidation = true      # Check cell data integrity when loading new areas

[Learning]
# CrashGuard learns which recovery strategies work best for each crash address.
# After many recoveries, it will use the fastest working strategy first.
enableLearning = true
patternDatabasePath = "Data/SKSE/Plugins/CrashGuard/patterns.json"

[Notifications]
# Controls whether the in-game overlay notification area is shown at all.
showNotifications = true
notificationTimeoutSeconds = 30  # How long the notification area stays visible

[UserNotifications]
# ═══════════════════════════════════════════════════════════════════════
# User Notification Settings
# ═══════════════════════════════════════════════════════════════════════
# Controls when CrashGuard shows you a toast notification after a recovery.
#
# Severity Levels:
#   Safe     - Visual glitches only (rendering, UI, cosmetic)
#   Warning  - Missing resources, null pointers (recoverable, no data loss)
#   Critical - Save data or persistent state affected (corruption risk)
#   Fatal    - Stack corruption, unrecoverable (cannot safely continue)

NotifyOnSafe = false          # Visual glitches — recovered silently
NotifyOnWarning = false       # Missing resources — recovered with toast
NotifyOnCritical = true       # Save data risk — always notify (recommended)
NotifyOnFatal = true          # Unrecoverable — always notify (recommended)

ShowToastForAutoRecovery = true    # Show brief notification for auto-recovered crashes
ToastDurationSeconds = 5           # How long the toast notification stays on screen

DialogTimeoutSeconds = 30          # Auto-dismiss notification after this many seconds
TimeoutDefaultAction = "Continue"  # Options: Continue, LoadLastSave, MainMenu

ShowTechnicalDetails = false       # Show crash address and instruction in the notification
AllowCrashAnywayOption = true      # Show "Let It Crash" button (useful for debugging)

[Performance]
scriptTimeoutMs = 5000    # How long a script can run before it is flagged as timed out (ms)
maxRecoveryAttempts = 3   # Max times VEH will re-attempt recovery before giving up

[Logging]
enableDetailedLogging = false  # Set to true only when debugging — greatly increases log size
logOnlyFailures = true         # Only log validation failures, not routine successes
logSuccessfulRecoveries = false  # Don't log every successful recovery (reduces bloat)
aggregatePatterns = true         # Show [AGGREGATED xN] prefix when the same crash recurs
maxLogSizeMB = 10  # Start a new log file when the current one reaches this size
maxLogFiles = 3    # Keep this many log files before deleting old ones

[InputDiagnostics]
# Set to true if the F11 menu isn't responding to keyboard input — this will log
# every keypress so you can diagnose what's being blocked by another mod.
enableInputDiagnostics = false

[Compatibility]
# Compatibility modes are automatically enabled when external tools are detected.
# CrashLogger: Auto-detected via DLL presence
# S.L.A.C.K.: Auto-detected via DLL presence
# No manual configuration needed.

[PapyrusValidation]
enabled = true           # Validate Papyrus native function parameters before execution
logFailures = true       # Log when a parameter fails validation
strictMode = false       # If true, block calls that fail validation (use with caution)

[InputConflictPrevention]
# ═══════════════════════════════════════════════════════════════════════
# Input Conflict Prevention System
# ═══════════════════════════════════════════════════════════════════════
# Prevents mouse wheel and D-pad from controlling camera or favorites
# while you are scrolling through a menu (dialogue, inventory, barter, etc.)
#
# HOW IT WORKS:
# 1. Vanilla menus are detected automatically — no setup needed
# 2. Modded menus are auto-detected using name pattern matching
# 3. Detected menus are remembered and applied every session
# 4. You can add menus manually below if auto-detection misses one

enabled = true                    # Enable input conflict prevention
blockCameraZoom = true            # Block camera zoom (mouse wheel) while in menus
blockFavorites = true             # Block favorites menu (D-pad) while in menus
autoDetectModdedMenus = true      # Auto-detect and remember modded menus
enableInputTracking = true        # Track which inputs each menu uses (diagnostics)

# If the camera still zooms in a specific modded menu, add its internal name here.
# Check the log file (logLevel=3) to find the exact menu name.
# Example: customScrollableMenus = ["SkyUIMenu", "CustomDialogueMenu"]
customScrollableMenus = []

[ImGui]
# ═══════════════════════════════════════════════════════════════════════
# F11 Configuration Menu Settings
# ═══════════════════════════════════════════════════════════════════════
# The F11 menu gives you a visual interface for all settings above,
# plus real-time monitoring, crash history, and diagnostic tools.
#
# Only set disableMenu = true if another mod's overlay conflicts with it.
# When disabled, all configuration must be done in this TOML file only.

disableMenu = false         # Set to true to completely disable the F11 menu
enableDebugLogging = false  # Log ImGui rendering internals (for troubleshooting menu bugs)
allowInVR = true            # Allow the F11 menu in VR mode

[PerformanceOverlay]
# A small on-screen overlay showing live stats (FPS, memory, recovery counts).
# Press F11 to configure position and which stats to show.
enabled = false
showFPS = true
showFrameTime = true
showMemory = true
showCrashStats = true
showRecoveryStats = true
showPatternStats = false
position = 1          # 0=TopLeft, 1=TopRight, 2=BottomLeft, 3=BottomRight
backgroundAlpha = 0.35
textAlpha = 1.0
scale = 1.0
