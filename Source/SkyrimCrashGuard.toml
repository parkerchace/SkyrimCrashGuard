# ═══════════════════════════════════════════════════════════════════════
# Skyrim Crash Guard Configuration
# Engine-Level Crash Recovery System
# ═══════════════════════════════════════════════════════════════════════

[General]
enabled = true
logLevel = 1  # 0=off, 1=errors/warnings only, 2=info, 3=debug, 4=trace

[Hotkeys]
# Menu hotkey (default: F11)
# Change this if you want to use a different key
# Available keys: F1-F12, Insert, Delete, Home, End, PageUp, PageDown, etc.
menuToggleKey = "F11"

# For controller-only users (Steam Deck, ROG Ally, VR):
# Native controller binding is not supported due to technical limitations.
# Use Steam Input or similar software to map a controller button to the menuKey.
# Example Steam Input combos: Back+Start, L4+R4, Hold Select (2s)

[VEH]
# Vectored Exception Handler (Layer 3)
enabled = true
cascadeLimit = 3  # Max recovery attempts during cascade

# High-frequency crash throttling
# Reduces performance impact when mods crash repeatedly (e.g., BetterThirdPersonSelection)
# After N crashes in X seconds, switches to silent recovery mode (still recovers, no logging)
enableModuleThrottling = true  # Enable per-module crash frequency throttling
moduleThrottleThreshold = 20   # Crashes before entering silent mode
moduleThrottleWindowMs = 2000  # Tracking window in milliseconds (2 seconds)
moduleSilentDurationMs = 30000 # Duration of silent recovery mode (30 seconds)
moduleRelogIntervalMs = 60000  # Re-log interval while in silent mode (60 seconds)

[Patches]
# Proactive engine patches
enabled = true

[ProactiveValidation]
# Layer 1: Validate data before it reaches the engine
enableMeshValidation = true
enableAnimationValidation = true
enableScriptMonitoring = true
enableCellValidation = true

[SafetyChecks]
# Layer 2: Null pointer and bounds safety
enableNullChecks = true
enableBoundsChecks = true
enableFormIDChecks = true

[StateManagement]
# Layer 5: Transactional state management
enableStateSnapshots = true
maxSnapshotsPerSession = 100

[Learning]
# Layer 6: Pattern learning and strategy optimization
enableLearning = true
patternDatabasePath = "Data/SKSE/Plugins/CrashGuard/patterns.json"

[Notifications]
# User notification settings
showNotifications = true
autoRecoverSafe = true        # Auto-recover Safe severity crashes
autoRecoverWarning = false    # Prompt for Warning severity
notificationTimeoutSeconds = 30

[UserNotifications]
# ═══════════════════════════════════════════════════════════════════════
# User Notification Settings
# ═══════════════════════════════════════════════════════════════════════
# Control when CrashGuard asks for your input vs auto-recovering crashes.
# 
# Severity Levels:
#   Safe     - Visual glitches only (rendering, UI, cosmetic)
#   Warning  - Missing resources, null pointers (recoverable, no data loss)
#   Critical - Save data or persistent state affected (corruption risk)
#   Fatal    - Stack corruption, unrecoverable (cannot safely continue)

# When to show user choice dialog (true = ask user, false = auto-recover)
NotifyOnSafe = false          # Visual glitches - auto-recover silently
NotifyOnWarning = false       # Missing resources - auto-recover with toast
NotifyOnCritical = true       # Save data risk - ALWAYS ask user (RECOMMENDED)
NotifyOnFatal = true          # Unrecoverable - ALWAYS ask user (RECOMMENDED)

# Toast notifications for auto-recovered crashes
ShowToastForAutoRecovery = true    # Show brief notification for Warning crashes
ToastDurationSeconds = 5           # How long toast appears (seconds)

# Dialog behavior
DialogTimeoutSeconds = 30          # Auto-select after this many seconds
TimeoutDefaultAction = "Continue"  # Options: Continue, LoadLastSave, MainMenu

# Advanced options
ShowTechnicalDetails = false       # Show stack traces and memory details in dialog
AllowCrashAnywayOption = true      # Show "Let It Crash" button for debugging
BatchSimilarCrashes = true         # Group similar crashes in one dialog (reduces spam)

# Logging
LogAllRecoveries = true            # Log all recoveries to F11 menu history
LogSilentRecoveries = false        # Log even silent Safe recoveries

[Performance]
scriptTimeoutMs = 5000
maxRecoveryAttempts = 3

[Logging]
enableDetailedLogging = false  # Set to true only for debugging
logOnlyFailures = true  # Only log validation failures, not successes
logSuccessfulRecoveries = false  # Don't log successful recoveries (reduces bloat)
aggregatePatterns = true
maxLogSizeMB = 10  # Rotate logs at 10MB
maxLogFiles = 3  # Keep last 3 log files

[InputDiagnostics]
# F11 Menu Input Diagnostics (for troubleshooting gamepad mode issues)
enableInputDiagnostics = true  # Set to true to enable detailed input logging

[Compatibility]
# Compatibility modes are automatically enabled when external tools are detected.
# CrashLogger: Auto-detected via DLL presence
# S.L.A.C.K.: Auto-detected via DLL presence
# No manual configuration needed.

[PapyrusValidation]
enabled = true           # Enable Papyrus native function parameter validation
logFailures = true       # Log when parameters fail validation
strictMode = false       # Block function calls that fail validation (use with caution)

# [ResourceLimiter], [NPCManagement], and [ActorLOD] sections removed in v2.3.6
# These features were disabled/incomplete and never functional.
# See CHANGELOG.md for details.

[InputConflictPrevention]
# ═══════════════════════════════════════════════════════════════════════
# Input Conflict Prevention System
# ═══════════════════════════════════════════════════════════════════════
# Prevents mouse wheel and D-pad from controlling camera/favorites while
# scrolling through menus (dialogue, inventory, barter, etc.)
#
# HOW IT WORKS:
# 1. Vanilla menus are automatically detected (no configuration needed)
# 2. Modded menus are auto-detected using pattern matching
# 3. Detected menus are automatically learned and remembered forever
# 4. You can manually add menus if auto-detection misses them
#
# INPUT TRACKING:
# - When enabled, tracks which inputs each menu actually uses
# - Logs detailed input profiles for diagnostics and mod developers
# - Helps identify conflicts without interfering with mod functionality
# - Check F11 menu Settings tab to see detected menus
#
# LOGGING:
# - Set logLevel=2 (info) to see all menu open/close events
# - Set logLevel=3 (debug) to see detailed detection info
# - Check the log to find menu names if camera still zooms in a menu

enabled = true                    # Enable input conflict prevention
blockCameraZoom = true            # Block camera zoom (mouse wheel) in menus
blockFavorites = true             # Block favorites menu (D-pad) in menus
autoDetectModdedMenus = true      # Auto-detect and learn modded menus
enableInputTracking = true        # Track which inputs each menu uses (for diagnostics)

# Custom scrollable menus (optional - only needed if auto-detection fails)
# Add menu names here if camera still zooms in a specific modded menu
# Check the log file to find the exact menu name
# Example: customScrollableMenus = ["SkyUIMenu", "CustomDialogueMenu"]
customScrollableMenus = []

# NOTE: Auto-detected menus are saved to:
#   Data/SKSE/Plugins/SkyrimCrashGuard/learned_menus.txt
# You can edit that file directly to add/remove menus

[ImGui]
# ═══════════════════════════════════════════════════════════════════════
# ImGui F11 Menu Settings
# ═══════════════════════════════════════════════════════════════════════

[Benchmark]
# Built-in benchmark actions control (enabled by default for in-game profiling)
allowBuiltinActions = true
# The F11 menu provides a visual interface for configuration and diagnostics.
# If you experience conflicts with other mods that use ImGui, you can disable it.
#
# IMPORTANT: When disabled, ALL configuration must be done via this TOML file.
# You will lose access to:
#   - Visual configuration interface
#   - Real-time resource monitoring
#   - Crash history viewer
#   - Performance metrics
#   - Input diagnostics
#
# Only disable if you have a specific conflict with another mod's ImGui overlay.

disableMenu = false  # Set to true to completely disable the F11 menu
